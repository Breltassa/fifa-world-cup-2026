    <main>

    <section class="bestellung">

        <h1 class="page-title">Trikot bestellen</h1>

        <form action="bestellung.php" method="post" class="bestellformular">

            <h2>Persönliche Daten</h2>

            <label for="vorname">Vorname</label>
            <input type="text" id="vorname" name="vorname" required>

            <label for="nachname">Nachname</label>
            <input type="text" id="nachname" name="nachname" required>

            <label for="strasse">Straße</label>
            <input type="text" id="strasse" name="strasse" required>

            <label for="hausnummer">Hausnummer</label>
            <input type="text" id="hausnummer" name="hausnummer" required>

            <label for="plz">Postleitzahl</label>
            <input type="text" id="plz" name="plz" maxlength="5" required>

            <label for="stadt">Stadt</label>
            <input type="text" id="stadt" name="stadt" required>

            <label for="telefon">Telefonnummer</label>
            <input type="tel" id="telefon" name="telefon" required>

            <label for="email">E-Mail</label>
            <input type="email" id="email" name="email" required>

            <h3>Bestellung</h3>

            <label for="artikel">Artikel auswählen</label>
            <select id="artikel" name="artikel" required>
                <option value="">Bitte auswählen</option>
                <option>Deutschland-Heimtrikot</option>
                <option>Brasilien-Heimtrikot</option>
                <option>Argentinien-Heimtrikot</option>
                <option>Kroatien-Heimtrikot</option>
                <option>Mexiko-Heimtrikot</option>
                <option>Italien-Heimtrikot</option>
                <option>Portugal-Heimtrikot</option>
                <option>Spanien-Heimtrikot</option>
            </select>

            <label for="groesse">Größe</label>
            <select id="groesse" name="groesse" required>
                <option value="">Bitte auswählen</option>
                <option>S</option>
                <option>M</option>
                <option>L</option>
                <option>XL</option>
                <option>XXL</option>
            </select>
            <label for="lieferung">Gewünschtes Lieferdatum</label>
            <input type="date" id="lieferung" name="lieferung">
            <h3>Zahlungsmethode</h3>
            <div class="zahlungsmethode">
                <input type="radio" id="paypal" name="zahlung" value="paypal" required>
                <label for="paypal">PayPal</label>
                <input type="radio" id="applepay" name="zahlung" value="applepay">
                <label for="applepay">Apple Pay</label>

                <input type="radio" id="googlepay" name="zahlung" value="googlepay">
                <label for="googlepay">Google Pay</label>
            </div>   
            <span id="agb-pos">
                <input type="checkbox" id="agb" required>
                <label for="agb" > Ich akzeptiere die AGB.</label>
            </span>    
            <button type="submit">Jetzt bestellen</button>

        </form>

    </section>
